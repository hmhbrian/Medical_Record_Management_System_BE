spring.datasource.url=jdbc:mysql://db:3306/clinicbooking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
c
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT secret
jwt.secret=${JWT_SECRET}

# CORS cho FE staging
app.cors.allowed-origins=https://fe.qlba.com

#Supabase config
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage-bucket-name=${SUPABASE_STORAGE_BUCKETNAME}
supabase.storage-base-url=${supabase.url}/storage/v1/object/public/${supabase.storage-bucket-name}
